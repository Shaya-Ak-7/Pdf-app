# GitHub Actions: Android debug APK build
#
# HOW TO ACTIVATE (takes ~2 minutes, no local setup needed):
#   1. Open the repo on GitHub → Add file → Create new file
#   2. Name it exactly:  .github/workflows/android-apk.yml
#   3. Paste this file's content and commit to your branch
#   4. Go to: Actions tab → "Build Android APK (debug)" → Run workflow
#   5. When it goes green, open the run → Artifacts → download "app-debug-apk"
#      → unzip → app-debug.apk is installable on any Android phone.
#
# (It lives in docs/ for now only because the bot token cannot create
#  workflow files; any repo owner adding it via the web UI works instantly.)

name: Build Android APK (debug)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
